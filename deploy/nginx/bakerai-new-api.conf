# /etc/nginx/snippets/bakerai-new-api.conf
#
# 由 BakerAI_new/deploy/switch_nginx.sh 安装（模板在同目录，别手改线上那份）。
#
# 作用：给「和网页同源」的 vhost（chat.peilika.beer / test2.peilika.beer）补上
# 新后端的反代。新前端只认相对路径 —— /v1/*、/group/*，所以这些 location
# 必须和静态站点在**同一个 server 块**里，不能另开域名。
#
# 为什么每个 location 都有 proxy_buffering off：
#   /v1/conversations/{id}/messages:stream 是 SSE。nginx 默认会把响应攒在缓冲里，
#   表现是"字一次性全蹦出来"或"卡十几秒才出字"。SSE 路径必须关缓冲。
#   对普通 JSON 关缓冲只是少一点合并优化，没有坏处，比"漏配一条"安全。
#
# 上传/取件的老形状（/upload、/fetch）超时 300s：
#   老客户端 XHR 超时就是 300s；线上 local.peilika.beer 只给了 120s，
#   大包/慢网会被 nginx 先断成 504，客户端却显示"取回失败"（已审计过）。

# ⚠️ 这里**不能**再放 `location /group/`：api/api2 两个 vhost 自己就有这个 prefix，
#    同一个 server 块里再来一次会 `duplicate location "/group/"`（2026-11-18 01:36 实测踩过）。
#    网页 vhost 需要 /group/ 的话，用另一份 bakerai-web-extra.conf。

# ---- 新契约：/v1/* ----
location /v1/ {
    proxy_pass http://127.0.0.1:5660;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering     off;
    proxy_cache         off;
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    # 数据包导入上限 64MB（后端自己的 import_max_bytes 也是 64MB）
    client_max_body_size 64m;
}

# /v1 本身（没有斜杠）直接回一个 JSON，别落到 SPA 的 index.html 上
location = /v1 {
    default_type application/json;
    return 200 '{"api":"v1","hint":"use /v1/meta"}';
}

# ---- 老客户端兼容形状（无状态 /chat、群聊 /group/*、实例 /instances、云同步 /upload /fetch）----
location = /chat {
    proxy_pass http://127.0.0.1:5660/chat;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /chat/stream {
    proxy_pass http://127.0.0.1:5660/chat/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering     off;
    proxy_cache         off;
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    gzip                off;
}

location = /chat/suggestions {
    proxy_pass http://127.0.0.1:5660/chat/suggestions;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}

location = /instances {
    proxy_pass http://127.0.0.1:5660/instances;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_read_timeout 30s;
}

# 老监控脚本读 /group-health（老群聊是独立服务，新后端只有一个进程）
location = /group-health {
    proxy_pass http://127.0.0.1:5660/health;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
}

location = /readyz {
    proxy_pass http://127.0.0.1:5660/readyz;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host       $host;
    proxy_read_timeout 15s;
}

# /health：api 系 vhost 本来就有（切完 upstream 后自动指向 5660）；
# 这里补一条 exact，让**网页域**也能被监控脚本探活（否则会落到 SPA 的 index.html 上假 200）。
location = /health {
    proxy_pass http://127.0.0.1:5660/health;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host       $host;
    proxy_read_timeout 10s;
}

# ---- 云同步（老客户端 POST 原始 JSON 包，最大 64MB）----
location = /upload {
    proxy_pass http://127.0.0.1:5660/upload;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
    proxy_request_buffering on;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /fetch {
    proxy_pass http://127.0.0.1:5660/fetch;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
