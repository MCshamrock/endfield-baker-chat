# 来源：服务器影子服务 venv 的 `pip freeze`（2026-11-15 18:57，Python 3.14.4）
# 用法：scripts/setup_venv.ps1 会装这个文件，不用手动 pip install
#
# 为什么要有这个文件：
#   pyproject.toml 里写的是范围（fastapi>=0.115,<1），只能保证"装得上"，不能保证"两边一样"。
#   范围里的任何一次上游发版都会让本机和服务器悄悄分叉 —— 那种 bug 最难查：
#   本地好好的，服务器报一个谁都没见过的错。
#   所以：**范围在 pyproject，具体版本在锁文件**；改依赖要同时改两处。
#
# 怎么更新（在服务器上装完先验证，再回来改这一份）：
#   /home/y/baker-v4/venv/bin/pip freeze | sort > /tmp/freeze.txt
#   —— 去掉 `-e ...` 那行，把结果贴回这里
#
# 已知差异：本机 Python 是 3.14.5，服务器是 3.14.4（同一 minor，只差一个 patch）。

