# panel.peilika.beer —— BakerAI 后台面板
#
# 这个文件是**部署件**，仓库里不执行。它假设：
#   · dist 放在 /var/www/panel.peilika.beer/dist（上一版在 .../dist.prev，用于秒回滚）
#   · 后端跑在本机 127.0.0.1:5660（uvicorn app.main:app）
#   · TLS 由外层负责（Cloudflare 橙云 / 证书），所以这里只写 80；
#     如果直接对外用 443，把文件末尾注释掉的 server 块打开。
#
# 放置：/etc/nginx/sites-available/panel.peilika.beer.conf
#       ln -s /etc/nginx/sites-available/panel.peilika.beer.conf /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#
# ⚠️ 一条必须记住的 nginx 规则：**add_header 不继承**。
#    只要某个 location 里写了自己的 add_header，server 级的那几条就整体失效。
#    所以下面每个"有自己的缓存头"的 location 都把安全头又写了一遍。
#    如果以后加了新的 add_header，记得同一段里把安全头补齐。

# 登录接口限速（可选，默认关闭）。
# 打开：去掉这行注释 + 去掉 login 那段里的 limit_req 注释。
# 后端自己有按设备/账号的登录节流（app/ratelimit.py），这里是第二道闸。
# limit_req_zone $binary_remote_addr zone=panel_login:10m rate=6r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name panel.peilika.beer;

    server_tokens off;

    # 静态站的根。**指到 dist 这一层**，不是它的父目录，
    # 否则 URL 会变成 /dist/...，而 index.html 里引用的 /assets/... 全部 404。
    root  /var/www/panel.peilika.beer/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 2m;   # 配置文本最长 200k 字符，留一倍余量

    # 兜底的安全头（对没有自己 add_header 的 location 生效）
    add_header X-Robots-Tag           "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "no-referrer" always;

    # ---- 后端接口：同源反代 ----
    #
    # 前端所有请求都是相对路径 /v1/...，这里原样转给本机后端。
    # location 带尾斜杠、proxy_pass **不带**尾斜杠 —— URI 原样透传
    # （/v1/admin/overview 进去还是 /v1/admin/overview），不会被改写。
    location /v1/ {
        proxy_pass         http://127.0.0.1:5660;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 后台接口都是"查库 + 返回 JSON"，几毫秒到几十毫秒；60 秒已非常宽松
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 接口一律不缓存（缓存了会看到旧数字，而且不同管理员看到的不一样）
        add_header Cache-Control          "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 登录接口单独一段，方便挂限速
    location = /v1/auth/login {
        # limit_req zone=panel_login burst=3 nodelay;
        proxy_pass         http://127.0.0.1:5660;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        add_header Cache-Control          "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- 静态资源 ----
    #
    # Vite 产物带内容哈希（index-H23TdFEU.js），可以放心长缓存。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag           "noindex, nofollow" always;
        access_log off;
    }

    # index.html **绝不能缓存**：它是"这一版用哪个 JS"的唯一入口。
    # 缓存住了就会有人在后台跑上一版面板（接口对、界面旧），是最难查的一类故障。
    location = /index.html {
        add_header Cache-Control          "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag           "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "no-referrer" always;
    }

    # SPA 兜底：认不出的路径一律回 index.html，由前端自己认路。
    # （现在用的是 hash 路由 #/users，将来改成 history 模式也不用动这里。）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 压缩：面板 CSS + JS 约 170KB，gzip 后约 55KB
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    access_log /var/log/nginx/panel.peilika.beer.access.log;
    error_log  /var/log/nginx/panel.peilika.beer.error.log;
}

